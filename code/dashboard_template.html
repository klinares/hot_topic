<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root {
  --paper: #fbfbfd; --ink: #231c36; --muted: #6b6680; --rule: #e4e2ec;
  --violet: #440154; --blue: #3b528b; --teal: #21918c; --sun: #fde725;
  --serif: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--sans); }
header.top { padding: 22px 28px 14px; border-bottom: 1px solid var(--rule); }
header.top h1 { margin: 0; font: 600 22px/1.2 var(--sans); letter-spacing: -.01em; }
header.top p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
.layout { display: grid; grid-template-columns: 340px 1fr; min-height: calc(100vh - 80px); }
aside { border-right: 1px solid var(--rule); padding: 16px 0; overflow-y: auto; max-height: calc(100vh - 80px); position: sticky; top: 0; }
aside .find { padding: 0 20px 12px; }
input[type=search] { width: 100%; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; font: inherit; background: #fff; color: var(--ink); }
input[type=search]:focus-visible, button:focus-visible, .topic:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.topic { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 10px 20px; cursor: pointer; font: inherit; color: inherit; border-left: 3px solid transparent; }
.topic:hover { background: #f1f0f6; }
.topic[aria-current="true"] { border-left-color: var(--violet); background: #efedf6; }
.topic .name { font-weight: 600; font-size: 14.5px; }
.topic .meta { color: var(--muted); font-size: 12.5px; }
.strip { display: flex; height: 8px; margin-top: 6px; border-radius: 2px; overflow: hidden; }
.strip span { flex: 1; }
main { padding: 22px 28px 40px; min-width: 0; }
.lede h2 { margin: 0; font: 600 26px/1.2 var(--sans); letter-spacing: -.015em; }
.lede p { margin: 6px 0 0; max-width: 72ch; font-family: var(--serif); font-size: 16.5px; line-height: 1.6; }
.facts { display: flex; gap: 26px; margin: 14px 0 6px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
.facts b { display: block; color: var(--ink); font-size: 18px; font-weight: 600; }
.charts { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin: 18px 0 8px; }
figure { margin: 0; }
figcaption { font-size: 12.5px; color: var(--muted); margin-top: 4px; max-width: 60ch; }
figure h3 { margin: 0 0 6px; font-size: 14px; font-weight: 600; }
svg text { font: 11px var(--sans); fill: var(--muted); }
.reader-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 22px 0 12px; padding-top: 16px; border-top: 1px solid var(--rule); }
.reader-bar input[type=search] { max-width: 300px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: #fff; padding: 7px 12px; font: inherit; font-size: 13.5px; cursor: pointer; color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--violet); color: #fff; }
button.act { border: 1px solid var(--violet); background: #fff; color: var(--violet); padding: 7px 12px; border-radius: 6px; font: inherit; font-size: 13.5px; cursor: pointer; }
button.act:hover { background: var(--violet); color: #fff; }
.count { color: var(--muted); font-size: 13px; margin-left: auto; }
article.item { padding: 14px 0; border-bottom: 1px solid var(--rule); max-width: 78ch; }
article.item .src { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
article.item .body { font-family: var(--serif); font-size: 16px; line-height: 1.62; white-space: pre-wrap; }
article.item .body .hit { background: #ece6ff; border-bottom: 2px solid var(--violet); }
.stance { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 9px; background: #e8f4f3; color: #145f5b; margin-left: 6px; }
mark { background: var(--sun); color: var(--ink); }
.more { margin: 16px 0; }
.empty { color: var(--muted); padding: 20px 0; }
.note { color: var(--muted); font-size: 12.5px; max-width: 78ch; margin-top: 30px; }
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  aside { position: static; max-height: 42vh; border-right: 0; border-bottom: 1px solid var(--rule); }
  .charts { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <h1>{{TITLE}}</h1>
  <p id="corpusline"></p>
</header>
<div class="layout">
  <aside>
    <div class="find"><input type="search" id="topicfind" placeholder="Find a topic by name or term" aria-label="Find a topic"></div>
    <nav id="topics" aria-label="Topics"></nav>
  </aside>
  <main id="main"></main>
</div>
<script id="data" type="application/json">{{DATA}}</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const P = D.paras;                        // columnar: uid, atom, year, topic, theta, text
const N = P.uid.length;
const byTopic = new Map(), byAtom = new Map();
for (let i = 0; i < N; i++) {
  if (!byTopic.has(P.topic[i])) byTopic.set(P.topic[i], []);
  byTopic.get(P.topic[i]).push(i);
  if (!byAtom.has(P.atom[i])) byAtom.set(P.atom[i], []);
  byAtom.get(P.atom[i]).push(i);
}
const years = [...new Set(P.year)].sort((a, b) => a - b);
const VIR = ["#440154","#482475","#414487","#355f8d","#2a788e","#21918c","#22a884","#44bf70","#7ad151","#bddf26","#fde725"];
const heat = v => VIR[Math.max(0, Math.min(10, Math.round(v * 10)))];
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (x, d = 3) => (x == null || isNaN(x)) ? "n/a" : Number(x).toFixed(d);

document.getElementById("corpusline").textContent =
  `${N.toLocaleString()} paragraphs from ${byAtom.size.toLocaleString()} documents, ` +
  `${years[0]} to ${years[years.length - 1]}, ${D.topics.length} topics. Built ${D.built}.`;

// ---- topic index: each topic carries a heat strip of its share of paragraphs by year
const yearTotals = new Map(years.map(y => [y, 0]));
for (let i = 0; i < N; i++) yearTotals.set(P.year[i], yearTotals.get(P.year[i]) + 1);
function yearShares(t) {
  const c = new Map(years.map(y => [y, 0]));
  for (const i of byTopic.get(t) || []) c.set(P.year[i], c.get(P.year[i]) + 1);
  return years.map(y => yearTotals.get(y) ? c.get(y) / yearTotals.get(y) : 0);
}
const shares = new Map(D.topics.map(t => [t.topic, yearShares(t.topic)]));
const maxShare = Math.max(...[...shares.values()].flat(), 1e-9);

function renderIndex(q = "") {
  const nav = document.getElementById("topics");
  const qq = q.trim().toLowerCase();
  const list = D.topics.filter(t => !qq || (t.label + " " + t.description + " " + (t.frex || "")).toLowerCase().includes(qq));
  nav.innerHTML = list.length ? "" : `<p class="empty" style="padding:0 20px">No topic matches "${esc(q)}". Try a word from a topic's terms.</p>`;
  for (const t of list) {
    const b = document.createElement("button");
    b.className = "topic"; b.dataset.topic = t.topic;
    b.setAttribute("aria-current", String(t.topic === state.topic));
    b.innerHTML = `<div class="name">${esc(t.label)}</div>
      <div class="meta">Topic ${t.topic}, ${(byTopic.get(t.topic) || []).length.toLocaleString()} paragraphs, ${fmt(100 * t.prevalence, 1)}% of the corpus</div>
      <div class="strip" title="Share of each year's paragraphs in this topic, ${years[0]} to ${years[years.length-1]}">${
        shares.get(t.topic).map(v => `<span style="background:${heat(v / maxShare)}"></span>`).join("")}</div>`;
    b.onclick = () => select(t.topic);
    nav.appendChild(b);
  }
}

// ---- charts (inline SVG, no libraries)
function lineChart(tr) {
  const W = 460, H = 200, L = 44, R = 10, T = 10, B = 26;
  if (!tr || !tr.Year.length) return `<p class="empty">No trend estimate for this topic.</p>`;
  const xs = tr.Year, ymax = Math.max(...tr.hi) * 1.08;
  const x = v => L + (v - xs[0]) / Math.max(1, xs[xs.length - 1] - xs[0]) * (W - L - R);
  const y = v => T + (1 - v / ymax) * (H - T - B);
  const band = xs.map((v, i) => `${x(v)},${y(tr.hi[i])}`).join(" ") + " " +
               xs.map((v, i) => `${x(v)},${y(tr.lo[i])}`).reverse().join(" ");
  const line = xs.map((v, i) => `${x(v)},${y(tr.fit[i])}`).join(" ");
  const ticks = [0, ymax / 2, ymax].map(v => `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v, 2)}</text>
      <line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#eceaf2"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Expected topic proportion by year with 95 percent interval">
    ${ticks}<polygon points="${band}" fill="#21918c" opacity=".18"/>
    <polyline points="${line}" fill="none" stroke="#21918c" stroke-width="2"/>
    <text x="${L}" y="${H - 6}">${xs[0]}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${xs[xs.length - 1]}</text></svg>`;
}
function barChart(idx) {
  const W = 460, H = 200, L = 34, R = 10, T = 10, B = 26;
  const c = new Map(years.map(y => [y, 0]));
  for (const i of idx) c.set(P.year[i], c.get(P.year[i]) + 1);
  const vals = years.map(y => c.get(y)), m = Math.max(...vals, 1);
  const bw = (W - L - R) / years.length;
  const bars = vals.map((v, i) => `<rect x="${L + i * bw + 1}" y="${T + (1 - v / m) * (H - T - B)}" width="${Math.max(1, bw - 2)}" height="${v / m * (H - T - B)}" fill="#3b528b"><title>${years[i]}: ${v}</title></rect>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Paragraphs per year in this topic">
    ${bars}<text x="${L - 6}" y="${T + 8}" text-anchor="end">${m}</text><text x="${L - 6}" y="${H - B}" text-anchor="end">0</text>
    <text x="${L}" y="${H - 6}">${years[0]}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${years[years.length - 1]}</text></svg>`;
}

// ---- reader: paragraphs of the topic, or the whole documents they came from
const state = { topic: null, view: "paragraphs", q: "", shown: 50 };
function highlight(text, q) {
  const safe = esc(text);
  if (!q) return safe;
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
  return safe.replace(re, m => `<mark>${m}</mark>`);
}
function rows() {
  const idx = byTopic.get(state.topic) || [];
  const q = state.q.trim().toLowerCase();
  if (state.view === "paragraphs") {
    return idx.filter(i => !q || P.text[i].toLowerCase().includes(q))
      .sort((a, b) => P.year[a] - P.year[b] || P.theta[b] - P.theta[a])
      .map(i => ({ id: P.uid[i], atom: P.atom[i], year: P.year[i], theta: P.theta[i],
                   stance: D.stance ? D.stance[P.uid[i]] : undefined, text: P.text[i] }));
  }
  const inTopic = new Set(idx);
  return [...new Set(idx.map(i => P.atom[i]))].map(a => {
    const parts = byAtom.get(a);
    return { id: a, atom: a, year: P.year[parts[0]], n_in_topic: parts.filter(i => inTopic.has(i)).length,
             n_paras: parts.length, parts, text: parts.map(i => P.text[i]).join("\n\n") };
  }).filter(r => !q || r.text.toLowerCase().includes(q)).sort((a, b) => a.year - b.year);
}
function renderReader() {
  const all = rows(), q = state.q.trim();
  const list = document.getElementById("list"), inTopic = new Set(byTopic.get(state.topic) || []);
  const noun = state.view === "paragraphs" ? "paragraph" : "document";
  document.getElementById("count").textContent =
    `${all.length.toLocaleString()} ${noun}${all.length === 1 ? "" : "s"}${q ? " matching" : ""}`;
  if (!all.length) { list.innerHTML = `<p class="empty">Nothing here contains "${esc(q)}". Clear the search to see every ${state.view === "paragraphs" ? "paragraph" : "document"} in this topic.</p>`; return; }
  list.innerHTML = all.slice(0, state.shown).map(r => state.view === "paragraphs"
    ? `<article class="item"><div class="src">${esc(r.atom)}, ${r.year}, topic share ${fmt(r.theta, 2)}${r.stance ? `<span class="stance">${esc(r.stance)}</span>` : ""}</div>
       <div class="body">${highlight(r.text, q)}</div></article>`
    : `<article class="item"><div class="src">${esc(r.atom)}, ${r.year}, ${r.n_in_topic} of ${r.n_paras} paragraphs in this topic (outlined)</div>
       <div class="body">${r.parts.map(i => inTopic.has(i) ? `<span class="hit">${highlight(P.text[i], q)}</span>` : highlight(P.text[i], q)).join("\n\n")}</div></article>`
  ).join("") + (all.length > state.shown ? `<div class="more"><button class="act" id="more">Show ${Math.min(50, all.length - state.shown)} more of ${(all.length - state.shown).toLocaleString()}</button></div>` : "");
  const m = document.getElementById("more");
  if (m) m.onclick = () => { state.shown += 50; renderReader(); };
}

// ---- CSV of exactly what is listed (search applied), UTF-8 with BOM for Excel
function csvCell(v) { const s = v == null ? "" : String(v); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }
function toCSV() {
  const t = D.topics.find(t => t.topic === state.topic), all = rows();
  const head = state.view === "paragraphs"
    ? ["para_uid", "atom_id", "Year", "topic", "topic_label", "theta_max", ...(D.stance ? ["stance"] : []), "text"]
    : ["atom_id", "Year", "topic", "topic_label", "paragraphs_in_topic", "paragraphs_total", "text"];
  const body = all.map(r => (state.view === "paragraphs"
    ? [r.id, r.atom, r.year, t.topic, t.label, r.theta, ...(D.stance ? [r.stance || ""] : []), r.text]
    : [r.atom, r.year, t.topic, t.label, r.n_in_topic, r.n_paras, r.text]).map(csvCell).join(","));
  return "\uFEFF" + [head.join(","), ...body].join("\r\n");
}
function download() {
  const t = D.topics.find(t => t.topic === state.topic);
  const slug = t.label.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([toCSV()], { type: "text/csv;charset=utf-8" }));
  a.download = `topic${String(t.topic).padStart(2, "0")}_${slug}_${state.view}${state.q ? "_filtered" : ""}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}

function select(topic) {
  Object.assign(state, { topic, q: "", shown: 50 });
  const t = D.topics.find(t => t.topic === topic), idx = byTopic.get(topic) || [];
  document.querySelectorAll(".topic").forEach(b => b.setAttribute("aria-current", String(+b.dataset.topic === topic)));
  document.getElementById("main").innerHTML = `
    <section class="lede"><h2>${esc(t.label)}</h2><p>${esc(t.description || "")}</p>
      <div class="facts">
        <div><b>${idx.length.toLocaleString()}</b>paragraphs</div>
        <div><b>${new Set(idx.map(i => P.atom[i])).size.toLocaleString()}</b>documents</div>
        <div><b>${fmt(100 * t.prevalence, 1)}%</b>of the corpus</div>
        <div><b>${fmt(t.avepp, 2)}</b>average assignment share</div>
      </div>
      ${t.proposition ? `<p style="font-size:14.5px"><span style="color:var(--muted)">Stance proposition:</span> ${esc(t.proposition)}</p>` : ""}
    </section>
    <div class="charts">
      <figure><h3>Prevalence over time</h3>${lineChart(D.trends[topic])}
        <figcaption>Model estimate from the STM with a 95 percent interval: expected share of text in this topic.</figcaption></figure>
      <figure><h3>Paragraphs per year</h3>${barChart(idx)}
        <figcaption>Exact counts of paragraphs whose most probable topic is this one. No interval: nothing here is estimated.</figcaption></figure>
    </div>
    <div class="reader-bar">
      <span class="seg" role="group" aria-label="Show">
        <button id="v-p" aria-pressed="true">Paragraphs</button><button id="v-d" aria-pressed="false">Whole documents</button></span>
      <input type="search" id="q" placeholder="Search the text" aria-label="Search the text of this topic">
      <button class="act" id="dl">Download CSV</button>
      <span class="count" id="count"></span>
    </div>
    <div id="list"></div>
    <p class="note">The download contains exactly what is listed, including any search filter. Paragraphs are listed by year, then by how strongly they load on this topic. In the documents view, the paragraphs belonging to this topic are outlined.</p>`;
  const setView = v => { state.view = v; state.shown = 50;
    document.getElementById("v-p").setAttribute("aria-pressed", String(v === "paragraphs"));
    document.getElementById("v-d").setAttribute("aria-pressed", String(v === "documents")); renderReader(); };
  document.getElementById("v-p").onclick = () => setView("paragraphs");
  document.getElementById("v-d").onclick = () => setView("documents");
  document.getElementById("q").oninput = e => { state.q = e.target.value; state.shown = 50; renderReader(); };
  document.getElementById("dl").onclick = download;
  renderReader();
}

document.getElementById("topicfind").oninput = e => renderIndex(e.target.value);
renderIndex();
if (D.topics.length) select(D.topics[0].topic);
</script>
</body>
</html>
