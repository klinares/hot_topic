# data-dict.yaml (spec: https://data-dict.tidyverse.org/)
# Generated by 03_stance.qmd; edit the script, not this file.
name: stance_topic_1
description: "Census stance measurement for STM topic 1 (National Restoration)."
version: 2026-09-24
tables:
  - name: topic_codebook
    path: D:/repos/hot_topic/outputs/topic_codebook.csv
    description: "Label, description, and proposition per topic. Analyst-edited; all three enter the stance prompt."
    rows: 12
    variables:
      - name: topic
        type: integer
        description: "STM topic number"
      - name: label
        type: string
        description: "Short human-readable name"
      - name: description
        type: string
        description: "One factual sentence about the topic"
      - name: proposition
        type: string
        description: "The contestable claim stance is measured toward"
      - name: prevalence
        type: double
        description: "undocumented"
      - name: avepp
        type: double
        description: "undocumented"
  - name: stance_labels
    path: D:/repos/hot_topic/outputs/stance_labels_topic01.csv
    description: "One row per paragraph per rater; the incremental label store."
    rows: 208
    variables:
      - name: para_uid
        type: string
        description: "Paragraph id"
      - name: rater
        type: string
        description: "Pipeline step that produced the label"
      - name: label
        type: string
        description: "favor, neutral, oppose, or irrelevant"
  - name: stance_trend
    path: D:/repos/hot_topic/outputs/stance_trend_topic01.csv
    description: "Fitted P(oppose) by year with cluster-robust intervals."
    rows: 36
    variables:
      - name: Year
        type: integer
        description: "Calendar year"
      - name: fit
        type: double
        description: "Fitted probability"
      - name: lo
        type: double
        description: "Lower 95% bound"
      - name: hi
        type: double
        description: "Upper 95% bound"
      - name: se_ratio
        type: double
        description: "Robust/naive SE ratio; the clustering cost"
      - name: stance
        type: string
        description: "Which stance this curve estimates"
  - name: recovery_curve
    path: D:/repos/hot_topic/outputs/recovery_curve_topic01.csv
    description: "Deviation from the census trend by subsample size."
    rows: 10
    variables:
      - name: n_target
        type: integer
        description: "Requested subsample size"
      - name: rep
        type: integer
        description: "Replicate index"
      - name: n_actual
        type: integer
        description: "Paragraphs actually drawn"
      - name: mad
        type: double
        description: "Mean absolute deviation"
glossary:
  - term: "stance"
    definition: "Position toward a stated proposition (favor, neutral, oppose) or irrelevant; distinct from sentiment."
  - term: "proposition"
    definition: "The contestable claim stance is measured toward; analyst-authored."
  - term: "census"
    definition: "Every paragraph in the topic was classified, so proportions are exact and carry no sampling error."
  - term: "cluster-robust"
    definition: "Standard errors allowing correlation among paragraphs from the same comment."
  - term: "recovery curve"
    definition: "Post-hoc subsampling of the census showing how quickly the trend estimate stabilizes."

